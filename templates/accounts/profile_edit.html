{% extends 'base.html' %}

{% block title %}プロフィール編集 - FollowGrow{% endblock %}

{% block content %}
<style>
    .edit-heading {
        text-align: center;
        font-size: 2.8rem;
        font-weight: 900;
        color: #ffffff;
        margin: 1rem 0 2.5rem 0;
    }

    .edit-avatar-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .edit-avatar-wrap {
        position: relative;
        width: 80px;
        height: 80px;
    }

    .edit-avatar-wrap img,
    .edit-avatar-wrap .avatar-placeholder {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        background-color: #ffffff;
        display: block;
    }

    .edit-avatar-wrap .gear-icon {
        position: absolute;
        bottom: 0;
        right: 0;
        background-color: rgba(0,0,0,0.4);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        cursor: pointer;
    }

    .edit-avatar-wrap input[type="file"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 80px;
        height: 80px;
        opacity: 0;
        cursor: pointer;
    }

    .edit-username {
        color: #ffffff;
        font-size: 1.4rem;
    }

    .bio-label {
        color: #ffffff;
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
    }

    .bio-input {
        width: 100%;
        max-width: 650px;
        min-height: 90px;
        border: none;
        border-radius: 16px;
        padding: 1rem;
        font-size: 1rem;
        font-family: inherit;
        resize: vertical;
        box-sizing: border-box;
    }

    .save-row {
        display: flex;
        justify-content: flex-end;
        max-width: 650px;
        margin-top: 1.5rem;
    }

    .save-btn {
        background-color: #a9a9a9;
        color: #ffffff;
        border: none;
        padding: 0.6rem 2rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 1rem;
    }

    .save-btn:hover {
        background-color: #c4c4c4;
    }
</style>

<h1 class="edit-heading">Profile Edit</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="edit-avatar-row">
        <div class="edit-avatar-wrap">
            {% if request.user.profile.avatar %}
                <img src="{{ request.user.profile.avatar.url }}" alt="avatar">
            {% else %}
                <div class="avatar-placeholder"></div>
            {% endif %}
            <div class="gear-icon">⚙</div>
            {{ form.avatar }}
        </div>
        <span class="edit-username">{{ request.user.username }}</span>
    </div>

    <div class="bio-label">自己紹介</div>
    {{ form.bio }}

    <div class="save-row">
        <button type="submit" class="save-btn">保存</button>
    </div>
</form>
{% endblock %}
