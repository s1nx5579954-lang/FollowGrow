{% extends 'base_auth.html' %}

{% block title %}新規登録 - FollowGrow{% endblock %}

{% block page %}
<style>
    .auth-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 300px;
    }

    .auth-form input {
        padding: 0.7rem 1rem;
        border-radius: 999px;
        border: none;
    }

    .auth-btn {
        background-color: #a9a9a9;
        color: #ffffff;
        border: none;
        padding: 0.7rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 1rem;
    }

    .auth-btn:hover {
        background-color: #c4c4c4;
    }

    .auth-link {
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        margin-top: 1rem;
        text-align: center;
    }
</style>

<div class="auth-screen">
    <h1>Follow Grow</h1>
    <h2>新規登録</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="auth-btn">Sign up</button>
    </form>
    <a href="{% url 'login' %}" class="auth-link">すでにアカウントをお持ちの方はこちら</a>
</div>
{% endblock %}
