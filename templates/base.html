<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FollowGrow{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}">FollowGrow</a></h1>
        <p>Share your small steps.</p>

        {% if user.is_authenticated %}
            <p>
                ようこそ、{{ user.username }} さん
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">ログアウト</button>
                </form>
            </p>
            <nav>
                <a href="{% url 'oneday_index' %}">OneDay Todo</a>
                <a href="{% url 'monthly_index' %}">Monthly Todo</a>
                <a href="{% url 'goalshare_timeline' %}">GoalShare</a>
            </nav>
        {% endif %}
    </header>

    <hr>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
