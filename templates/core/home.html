<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FollowGrow</title>
</head>
<body>
    <h1>FollowGrow</h1>
    <p>Share your small steps.</p>

    <p>
        ようこそ、{{ user.username }} さん
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">ログアウト</button>
        </form>
    </p>

    <nav>
        <a href="{% url 'oneday_index' %}">OneDay Todo</a>
        <a href="{% url 'monthly_index' %}">Monthly Todo</a>
        <span>GoalShare(準備中)</span>
    </nav>
</body>
</html>
