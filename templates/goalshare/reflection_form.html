<!-- GoalShare/templates/goalshare/reflection_form.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>今日の振り返り - FollowGrow</title>
</head>
<body>
    <h1>今日の振り返り</h1>

    <p>
        <a href="{% url 'home' %}">FollowGrowトップ</a> |
        <a href="{% url 'goalshare_timeline' %}">タイムライン</a>
    </p>

    <h2>今日完了したタスク</h2>
    <ul>
        {% for task in completed_tasks %}
            <li>{{ task.content }}</li>
        {% empty %}
            <li>今日完了したタスクはまだありません</li>
        {% endfor %}
    </ul>

    <h2>{% if existing %}振り返りを編集{% else %}振り返りを投稿{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if existing %}更新{% else %}投稿{% endif %}</button>
    </form>
</body>
</html>
